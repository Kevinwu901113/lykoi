# Lykoi Cordis M1 骨架 · 插件树（直排 entries；M1 不用 bundle 分层，patch 层 M3 引入）
# 顶层必须是数组（WO-M0-DSH-STUDY §2.1）。路径类配置相对进程 cwd（从仓库根 npm start）。
- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'
- id: audit
  name: lykoi-audit
  config:
    path: var/audit.jsonl
- id: budget
  name: lykoi-budget
  config:
    ledgerPath: var/budget.json
    # dev 硬顶：mock 路由 50 tokens/UTC 日（两次 34-token 调用后第三次必拒 → 红测），
    # 总量 1000。生产硬顶 M3 治理侧定。
    dailyTotalTokens: 1000
    dailyRouteTokens:
      mock: 50
- id: heart
  name: lykoi-heart
  config:
    # M2-W3 转正：基线/地板/显著性策略在插件内（env LYKOI_HEARTBEAT_BASELINE_MIN 可调基线）。
    checkIntervalMs: 1000
    stateFile: var/heart-state.json
    # salience_shadow.db 读侧（G-3）：dev 尚无 sidecar，留空=纯基线；env LYKOI_SALIENCE_DB 优先。
    salienceDb: ''
- id: llm
  name: '@deepseek-ai/dsh-llm'
- id: llm-mock
  name: lykoi-llm/mock
  config:
    provider: mock
- id: lykoi-llm
  name: lykoi-llm
# ==== M2 W5：对话心智（由 M1 converse-min 演进）+ telegram 器官 ====
# lykoi-converse = 真装配器 + 信封周期（S-23..S-53 + G-10）。它需要一个可写
# state 副本（dbPath）与 owner 域 persona TOML（personaToml）——两者都是治理侧
# 供给的部署事实，dev profile 默认 disabled；启用是治理侧动作（golden devstate
# 永远只读，不得直接接进来）。
- id: converse
  name: lykoi-converse
  disabled: true
  config:
    dbPath: var/dev-state.db
    personaToml: packages/lykoi-decide/test/fixtures/lykoi_base.toml
    route: mock
    model: mock-model
    restartMarker: var/restart-marker.json
# telegram 生产传输默认 disabled（工单④）：本波骨架不接真网；启用是治理侧动作
# （需 lykoiMemory 的 state 副本路径与 tokenEnv 环境引用一并配好——凭据永不落明文）。
# dev 用 fake transport 的装配只存在于测试（lykoi-adapter-telegram/testing），不进 profile。
- id: memory
  name: lykoi-memory
  disabled: true
  config:
    dbPath: ../lykoi-cordis-devstate/memory.db
- id: telegram-transport
  name: lykoi-adapter-telegram/production
  disabled: true
  config:
    tokenEnv: LYKOI_TELEGRAM_BOT_TOKEN
- id: telegram
  name: lykoi-adapter-telegram
  disabled: true
  config:
    cursorPath: var/telegram-cursor.json
    archivePath: var/telegram-inbound.json
