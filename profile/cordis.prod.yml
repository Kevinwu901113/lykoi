# ============================================================================
# Lykoi Cordis · **生产** profile（M3-W4；M2 遗留归位表 #10）
# ============================================================================
#
# 与 `cordis.yml`（dev）的关系：**两套分明，互不覆盖**。
#   - `cordis.yml`      = dev：保持现状、开箱能跑、零真网、零 root 供给。
#   - `cordis.prod.yml` = prod：本文件。**main 上的本文件 = 生产装配**
#     （2026-09-02 起；此前六个器官位在 main 上 disabled、只在 m4-switch
#     分支翻开，落地要重钉游离提交——已废止）。每个器官位的注释写明它需要
#     哪一样 root 供给；全新部署供给没到位的位可临时加 `disabled: true`，
#     供给到位后删掉再重签。
#
# 启动次序（生产）：
#   0. **切换窗一次性**（GK-9 / m4_handoff 前置 #1，在首次签 manifest **之前**跑）：
#      node packages/lykoi-kernel/src/bootstrap-preauth.ts \
#        --state-db /home/lykoi/state/memory.db \
#        --rules    /home/lykoi/state/approval_rules.json \
#        --standing /home/lykoi/state/standing_grants.json
#      装 owner 初始预授权 = 解 S1B 死锁（没有它，她的第一句审批问句自己撞在门上）。
#      幂等：授权行已在册就一个字节都不写，所以「原样搬活体那份」之后照样能跑一遍
#      当确认（先 --dry-run 体检格式兼容性）。规则文件不在哈希钉面上（GK-15，
#      运行期合法可写，完整性归检查项⑥）——先跑它再签 manifest 仍是好次序，
#      但次序错了也不再是死锁。
#   1. `node packages/lykoi-gate/src/cli.ts`   ← 完整性门（systemd ExecStartPre）
#      任一检查项有问题 → exit 1 → 服务不起来。这是 fail closed 的物理面。
#   2. `node profile/index.prod.ts`（生产专用入口，M4-W2；零 env 读取、写死本
#      装配 —— 曾设想的 LYKOI_PROFILE=prod 被否决：env 选装配 = 钉面外开旋钮）
#
# 本文件在 GK-13 的 **root 属主域**（`packages/lykoi-gate/src/surface.ts` 的
# `PROFILE_ROOT_OWNED_FILES`）：它说 audit sink 落在哪、GK-8 开关开没开、哪些
# 器官启用 —— 全是治理决定。改一个字节 → manifest 哈希不符 → 启动闸红。
# 合法修改路径：改完 `sudo node packages/lykoi-gate/src/cli.ts --write-manifest`。
#
# env 钉面（GK-6）：治理 state 路径**一律不在 unit 文件里设**（钉面要求它们
# 未设或等于规范值，未设 = 走本文件与源码里已签名的缺省）。unit 里只该有
# `LYKOI_TELEGRAM_BOT_TOKEN`（密钥，门永不读值）。
# 规范路径全表见 `packages/lykoi-gate/src/surface.ts` 的 `ENV_PINS`。
# ============================================================================

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

# ---- 治理地基①：immutable 审计 sink ----------------------------------------
# 规范路径 = /var/log/lykoi-audit/audit.jsonl（活体逐字 AUDIT_CANONICAL）。
# root 供给（完整性门检查项⑦逐条核）：
#   sudo install -d -o root -g root -m 755 /var/log/lykoi-audit
#   sudo install -o root -g lykoi -m 620 /dev/null /var/log/lykoi-audit/audit.jsonl
#   sudo chattr +a /var/log/lykoi-audit/audit.jsonl
# 六断言：非符号链 / 存在 / root 属主 / 服务用户可 append / append-only 属性在 /
# 父目录 root 且组他人不可写。
- id: audit
  name: lykoi-audit
  config:
    path: /var/log/lykoi-audit/audit.jsonl

# ---- 预算 -------------------------------------------------------------------
# 生产硬顶。dev 的 50 tokens/日是为了让红测三次调用就撞墙，生产值另定。
- id: budget
  name: lykoi-budget
  config:
    ledgerPath: /home/lykoi/state/budget.json
    dailyTotalTokens: 2000000
    dailyRouteTokens:
      # 键名 = LLM 调用的 route 名（gate/charge 按它记账）——随下方 route 位同名。
      deepseek-official: 2000000

# ---- 心脏 -------------------------------------------------------------------
# 基线节律走源码缺省（30 分钟）：`LYKOI_HEARTBEAT_BASELINE_MIN` 是 GK-6 的
# **旋钮类**钉面，生产必须未设 —— 要改就改源码再 root 重签。
- id: heart
  name: lykoi-heart
  config:
    checkIntervalMs: 1000
    stateFile: /home/lykoi/state/heart-state.json
    # G-3 显著性影子库（sidecar 供给后填规范路径；空 = 纯基线）。
    salienceDb: ''

# ---- LLM --------------------------------------------------------------------
- id: llm
  name: '@deepseek-ai/dsh-llm'
- id: lykoi-llm
  name: lykoi-llm
- id: llm-deepseek
  name: lykoi-llm-deepseek
  # 启用。root 供给：/home/lykoi/secrets/llm.env（禁区①，她永不可达）
  # WO-FIX-THINKPOLICY-01 D-2：推理档位只有这一个主人。此前不配 config 时
  # wire 上 thinking/reasoning_effort 两个键都不出现，档位落到供应商侧的模型
  # 缺省（读数上是 HIGH，隐式）；converse 又按 step 改口，85 s 归不到任何一处。
  # 档位由探针 v5（2026-09-04）按 D-4 规则定：low —— step 0 ≤ 15 s、
  # step ≥ 1 ≤ 5 s、信封合法率 100%；off 在 step 0 会放弃工具（「没法查」），
  # high 与 low 时延无稳定差别且 reasoning 更长。改档位改这里，不改代码。
  config:
    thinking: enabled
    reasoningEffort: low

# ---- 记忆（她的 state 库）---------------------------------------------------
# **R-01 硬规则**：M4 切换窗里新旧体绝不同时写 state。旧体停稳之前这一条
# 不许翻开（docs/m4_handoff.md 前置 #4）。
- id: memory
  name: lykoi-memory
  # 启用（R-01：旧体已退役；任何并行写 state 的进程停稳之后才许起本装配）
  config:
    dbPath: /home/lykoi/state/memory.db

# ---- 浏览器器官（她自己的那双手）-------------------------------------------
# **位置定死在 converse / wake 之前**（WO-M5-ORGAN-BROWSER D-9）：那两个位在
# 各自的 apply 里调 `outboundOrganResources()` 取一次快照喂 `OrganInventoryCache`，
# 快照是**调用时**的 `_extraOrgans`。器官位排在它们后面 = 清单里没有这三项
# （她会以为自己没有手），而这里排在前面就不必动 wake / converse 一行 src。
#
# 大脑侧这一条**只需要一个 socket 路径**：Chrome、持久 profile、截图全在另一个
# OS 用户（lykoi-browser）的独立 systemd 单元里，大脑永不 spawn 浏览器。
# root 供给（逐条命令见 docs/browser_organ.md）：
#   useradd lykoi-browser；/etc/lykoi-browser/host.json（root:root 644）；
#   lykoi-browser.service（RuntimeDirectory=lykoi-browser，socket 0660 组 lykoi）。
# **宿主没起来大脑照常起**：三个动作返回 browser_host_unreachable，清单仍列三项
# （接线是事实，宿主在不在是状况）——器官是手，不是心脏。
- id: browser
  name: lykoi-organ-browser
  config:
    socketPath: /run/lykoi-browser/host.sock

# ---- 对话心智 ---------------------------------------------------------------
# 需 root 供给：①memory 库（见上，R-01 约束）②人格 TOML
# （/home/lykoi/runtime/persona/lykoi_base.toml，root 属主 444，父目录 root）——
# 完整性门检查项②③⑤三处核它（属主 / env 不许重定向 / 哈希；DA-11 取证对象）。
- id: converse
  name: lykoi-converse
  # 启用
  config:
    dbPath: /home/lykoi/state/memory.db
    personaToml: /home/lykoi/runtime/persona/lykoi_base.toml
    # route 名必须 = vendor 注册常量 `deepseek-official`（vendor/index.js:1628
    # 写死，配置面无改名位）；对不上 = dsh-llm NO_ADAPTER 被归一成空回复，
    # 全体调用无声失败（WO-INC-LLM-ROUTE 事故正本）。model 取 vendor 目录
    # 且老体实证的主模型。
    route: deepseek-official
    model: deepseek-v4-flash
    restartMarker: /home/lykoi/state/restart-marker.json
    narrativeFlag: ''
    # M3-W4 restart 生产采集器（M2 遗留 #8）。两者都给才采得到 HEAD 与 downtime；
    # 采不到 = 省略，**绝不编造**（SA-164）。
    restartRepoRoot: /home/lykoi/projects/lykoi-cordis
    restartUnit: lykoi-cordis
    # ===== GK-8 决断项：默认关 =====
    # 开 = kind=notification 并入 chat_outbox 投递线 = 通知从 pull 变 push。
    # 这**改变到达行为**，蓝图明定开启是 Kevin 的决断，构建侧不自作主张。
    notificationOutboxDelivery: false
    # ===== D-01 三旋钮（M4 决断项，Kevin 2026-08-31「按现有建议默认值」批） =====
    # 语义不是工程参数是治理决定；数与说明见文末 D-01 段与
    # lykoi-converse/src/deadline.ts（源码单一出处，这三行删了也是同样三个数）。
    interpretTimeoutS: 30
    interpretRetries: 1
    cycleTimeoutS: 180
    # ===== vision 路由位：M4 定案「显式 disabled」 =====
    # deepseek-v4-flash 无视觉面，切换窗不开新回路。写显式值而非留空 ——
    # 「忘了填」（空串）与「决定不开」（disabled）在事件流上必须分得开。
    visionRoute: disabled
    visionModel: disabled

# ---- 自主侧（wake）-----------------------------------------------------------
# 同样受 R-01 约束（写同一个 state 库）。
#
# **这里没有 learn 条目，是定案不是缺件**（D-FIX-2，WO-M4-FIX-WAKE）：
# `lykoi-learn` 是**纯库**（整合/专注的 re-export 桶，没有 apply），它的驱动位在
# wake —— SA-171：一拍 completed 之后由 wake 串行驱动整合与专注，各自吞掉异常。
# 曾经这里挂过一条 `- id: learn / name: lykoi-learn`，那条从第一天起就是错的：
# 一被翻开 loader 就 `invalid plugin, expect function or object with an "apply"
# method`（2026-09-01 00:54 切换窗事故的两条根因之一）。修法是删掉条目，
# 不是给一个库套插件壳。
- id: wake
  name: lykoi-wake
  # 启用
  config:
    dbPath: /home/lykoi/state/memory.db
    # 人格 TOML：与 converse 段**同一个文件**（D-FIX-1）—— 醒着的她和聊天的她
    # 读同一份先天内核，装配面只给路径，数据本身只有 owner 域 TOML 一个事实源。
    # root 属主 444、父目录 root；完整性门检查项②③⑤三处核它。
    personaToml: /home/lykoi/runtime/persona/lykoi_base.toml
    # route/model 约束同 converse 段（vendor 常量 deepseek-official，
    # WO-INC-LLM-ROUTE 事故正本）。
    route: deepseek-official
    model: deepseek-v4-flash
    checkIntervalMs: 5000

# ---- 出站器官（Telegram）----------------------------------------------------
# 需 root 供给：unit 文件里的 `Environment=LYKOI_TELEGRAM_BOT_TOKEN=…`
# （凭据永不落进本文件、永不落进仓库；门只看设没设/空不空，**永不读值**）。
# `LYKOI_TELEGRAM_PROXY` 是 GK-6 的 **unset 类**：设了就是一条外泄通道，
# 生产必须未设。BotApiTransport 的真 HTTP 接线（M4 前置 #8）已在 M4-W1 落地：
# 真 fetch 住在 lykoi-adapter-telegram/src/http.ts，**只在本条目的装配面被选中**。
- id: telegram-transport
  name: lykoi-adapter-telegram/production
  # 启用
  config:
    tokenEnv: LYKOI_TELEGRAM_BOT_TOKEN
    # M4 前置 #8：出站代理这一位**只能从这里来**（传输层零 env 读取；
    # LYKOI_TELEGRAM_PROXY 是 GK-6 的 unset 类，生产必须未设）。
    # 生产网络事实（2026-08-31 取证）：主机直连 api.telegram.org 超时不通，
    # 经内网代理箱 1.2s 通 —— 所以这一位在生产**必须非空**。真身是 undici
    # ProxyAgent（http.ts 文件头④）：proxy 非空则每请求带 dispatcher，不存在
    # 静默直连；https 目标走 CONNECT 隧道，含 token 的 URL 始终在 TLS 里，
    # 代理箱只见 api.telegram.org:443。本值无凭据；本文件是 root 属主域钉面
    # 成员，这个值随 manifest 由 root 签署，改它 = 重签。
    proxy: 'http://192.168.0.202:7890'
- id: telegram
  name: lykoi-adapter-telegram
  # 启用
  config:
    cursorPath: /home/lykoi/state/telegram-cursor.json
    archivePath: /home/lykoi/state/telegram-inbound.json
    pollTimeoutS: 25
    autoStart: true

# ============================================================================
# 生产 state 路径全表（= 完整性门 GK-6 钉面的 canonical 值；本文件与源码缺省
# 必须与它逐条一致）
# ============================================================================
#   /home/lykoi/state/approval_rules.json        LYKOI_APPROVAL_RULES   (活体逐字)
#   /home/lykoi/state/standing_grants.json       LYKOI_STANDING_GRANTS  (GK-6 补钉)
#   /home/lykoi/state/pending_actions.json       LYKOI_PENDING_ACTIONS  (GK-6 补钉)
#   /home/lykoi/state/notifications.json         LYKOI_NOTIFICATIONS
#   /home/lykoi/state/proactive_chat.json        LYKOI_PROACTIVE_CHAT_LEDGER
#   /home/lykoi/state/chat_outbox.json           LYKOI_CHAT_OUTBOX          (W3#5 ①)
#   /home/lykoi/state/telegram_undelivered.json  LYKOI_TELEGRAM_UNDELIVERED (W3#5 ②)
#   /home/lykoi/state/telegram_outbox.cursor     LYKOI_TELEGRAM_OUTBOX_CURSOR(W3#5 ③)
#   /home/lykoi/state/messenger_outbound.json    LYKOI_MESSENGER_LEDGER     (W3#5 ④)
#   /home/lykoi/state/messenger_transport.jsonl  LYKOI_MESSENGER_TRANSPORT_LOG(W3#5 ⑤)
#   （LYKOI_TELEGRAM_PROXY = W3#5 ⑥，unset 类，必须未设）
#   /home/lykoi/state/salience_shadow.db         LYKOI_SALIENCE_DB
#   /var/log/lykoi-audit/audit.jsonl             LYKOI_AUDIT_PATH       (活体逐字)
#   /home/lykoi/runtime/persona/lykoi_base.toml  LYKOI_PERSONA_TOML     (活体逐字)
#
# 上表怎么与源码缺省对上的（D-SC-1，WO-STATE-CANON）：**靠一条符号链接**。
# 源码缺省全部是仓库相对的 `var/state/…`（lykoi-kernel/src/approval.ts:36 等
# 十余处），生产机上 `<repo>/var/state` 是指向 `/home/lykoi/state` 的符号链接
# （lykoi 属主）。定案刻意**不改**源码相对缺省、**不加** unit env（Environment=
# 面只放凭据），于是「两个落点会不会分叉」全落在那一条链接上。
# 供给步：docs/deploy.md §4b、WO-M4-W2/paste-1-prepare.sh §3b。
# 守它的是完整性门检查项⑧（verify.ts checkStateCanon）：是链接且 realpath 等于
# canonical → 绿；**是真实目录 → 红**（分叉已发生）；**不存在 → 同样红**
# （运行期 writeJsonAtomic 会 mkdir，缺失 = 未来分叉）。
# 开发机维持真实目录形态，那是 dev 装配自己的 state，与本表无关。
#
# ============================================================================
# D-01 超时预算 · 生产值（**已填；M4-W1**）
# ============================================================================
# 解释器判读 T=0/400 tokens 的调用超时、重试次数，属于「一次审批问句等多久才算
# 问不到」这一类语义决定 —— 填一个数进去就是替 Kevin 拍了板。所以这三个数是
# 治理侧建议值经 **Kevin 2026-08-31「这三个按照现有建议默认值」授权** 采用
# （docs/m4_blueprint.md §决断项定案；否决窗口 = 切换窗前）。
#   converse.config.interpretTimeoutS: 30   判读是小调用（经代理），30s 有界；
#                                           语义=「30s 问不到就算问不到」。
#   converse.config.interpretRetries:  1    与 G-10 信封 not_json 有界重试同形；
#                                           配超时 = 最坏 60s，算得出来。
#   converse.config.cycleTimeoutS:     180  周期含信封调用 + 工具派发；活体实证
#                                           有 89s 的合法长答，180s = 两倍余量。
#                                           D1 中位 <15s 仍是健康指标不是杀线。
# 强制点在 lykoi-converse：判读 = setApprovalInterpretLlm wrapper 上的
# runInterpretWithDeadline（AbortSignal 递进 dsh-llm，超时真掐那一跳）；周期 =
# Conversation.send 的 withDeadline。超时事件带 elapsed 入 audit（零正文）。
# **删掉上面三行不会换语义**：Schema 缺省读同一份 D01_DEFAULTS。
#
# ============================================================================
# vision 路由位（M4 定案：**显式 disabled**）
# ============================================================================
# `lykoi-converse/src/vision.ts` 的 describeImage seam 在位，但 deepseek-v4-flash 无
# 视觉面，切换窗不为它开新回路 ——
#   converse.config.visionRoute: disabled
#   converse.config.visionModel: disabled
# 装配面读到 disabled 时 **零真模型调用**：describeImage 抛 VisionDisabledError，
# 由 Conversation 的 vision_error 分支接住（她知道自己没看见，而不是收到一句
# 凭空的描述）。空串是另一回事 = **漏填**，同样零调用但措辞与事件分开 ——
# 「忘了填」和「决定不开」必须一眼分得出。装配期落 `vision_seam_state` 一条。
